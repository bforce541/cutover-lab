[project]
name = "migration-rehearsal"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "duckdb>=1.4,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-dotenv>=1.1,<2",
    "truststore>=0.10.5,<1",
]

[project.optional-dependencies]
cloud = [
    "databricks-sql-connector[pyarrow]>=4,<5",
    "google-cloud-bigquery>=3.38,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx2>=2.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
